services:
  postgres:
    image: postgres:16
    container_name: cryptopulse-postgres
    environment:
      POSTGRES_USER: cryptopulse
      POSTGRES_PASSWORD: cryptopulse123
      POSTGRES_DB: cryptopulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: cryptopulse-airflow-init
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://cryptopulse:cryptopulse123@cryptopulse-postgres:5432/cryptopulse_db"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin123"
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@cryptopulse.com --password admin123 || true"

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: cryptopulse-airflow-webserver
    restart: always
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://cryptopulse:cryptopulse123@cryptopulse-postgres:5432/cryptopulse_db"
      AIRFLOW_CONN_POSTGRES_CRYPTOPULSE: "postgres://cryptopulse:cryptopulse123@cryptopulse-postgres:5432/cryptopulse_db"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "J281G1zkMlSEL1S3QxNn5H-mAWH1ib40gNj14IqgoJQ="
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: webserver

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: cryptopulse-airflow-scheduler
    restart: always
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://cryptopulse:cryptopulse123@cryptopulse-postgres:5432/cryptopulse_db"
      AIRFLOW_CONN_POSTGRES_CRYPTOPULSE: "postgres://cryptopulse:cryptopulse123@cryptopulse-postgres:5432/cryptopulse_db"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "J281G1zkMlSEL1S3QxNn5H-mAWH1ib40gNj14IqgoJQ="
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producer:/opt/airflow/producer     
      - ./scripts:/opt/airflow/scripts       
      - ./models:/opt/airflow/models    
      - ./spark:/opt/airflow/spark     
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cryptopulse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cryptopulse.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"

  kafka:
    image: apache/kafka:4.0.0
    container_name: cryptopulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cryptopulse-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cryptopulse-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  spark:
    image: apache/spark:3.5.6
    container_name: cryptopulse-spark
    user: root
    depends_on:
      - kafka
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/app/spark     
      - ./data:/app/data       
      - ./models:/app/models
    command: bash -c "pip install numpy && tail -f /dev/null"

  cryptopulse-producer:
    image: python:3.11-slim
    container_name: cryptopulse-producer
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./producer:/app/producer
    command: bash -c "pip install kafka-python websocket-client requests pandas sqlalchemy psycopg2-binary && python /app/producer/producer.py"

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: cryptopulse-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit:/app
      - ./models:/app/models
    working_dir: /app

  python:
    image: python:3.11-slim
    container_name: cryptopulse-python
    tty: true
    volumes:
      - ./:/app
    working_dir: /app
    command: tail -f /dev/null

volumes:
  postgres_data:
  kafka_data:


